name: Temporary package for local delivery
on:
  push:
    branches:
      - mehrsam-jeans-audited-redesign-20261023
    paths:
      - '.github/workflows/package-redesign-archive.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          python - <<'PY'
          import os
          import zipfile
          source = os.getcwd()
          output = "/tmp/Mehrsam-Jeans-Redesigned.zip"
          temporary_workflow = ".github/workflows/package-redesign-archive.yml"
          ignored_dirs = {".git", "node_modules", ".venv", "venv", "__pycache__"}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for root, dirs, files in os.walk(source):
                  dirs[:] = sorted(d for d in dirs if d not in ignored_dirs)
                  for filename in sorted(files):
                      full_path = os.path.join(root, filename)
                      relative_path = os.path.relpath(full_path, source).replace(os.sep, "/")
                      if relative_path == temporary_workflow:
                          continue
                      archive.write(full_path, relative_path)
          with zipfile.ZipFile(output, "r") as archive:
              assert archive.testzip() is None, "ZIP validation failed"
              print("ZIP entries:", len(archive.namelist()))
          print("ZIP created:", output, "bytes:", os.path.getsize(output))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mehrsam-jeans-redesigned
          path: /tmp/Mehrsam-Jeans-Redesigned.zip
          retention-days: 1
